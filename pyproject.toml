[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oncograph"
version = "0.1.0"
description = "Evidence-first oncology knowledge graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "sqlmodel>=0.0.22,<1",
  "uvicorn[standard]>=0.30,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
oncograph = "oncograph.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/oncograph"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
