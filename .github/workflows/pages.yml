name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Find latest successful data refresh run
        id: find_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow refresh-data.yml \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No successful 'Refresh data' workflow run found. Run that workflow (manually, or wait for its weekly schedule) before this one can deploy."
            exit 1
          fi
          echo "Using data from refresh-data run $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download search index artifact
        uses: actions/download-artifact@v4
        with:
          name: search-index
          path: _data-refresh
          run-id: ${{ steps.find_run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify and install the downloaded index
        run: |
          for f in search-index.json relations.json stats.json; do
            if [ ! -s "_data-refresh/$f" ] || [ "$(cat "_data-refresh/$f")" = "[]" ]; then
              echo "::error::_data-refresh/$f is missing or empty; refusing to deploy an empty index."
              exit 1
            fi
          done
          mkdir -p web/data
          cp _data-refresh/search-index.json web/data/search-index.json
          cp _data-refresh/relations.json web/data/relations.json
          cp _data-refresh/stats.json web/data/stats.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
