name: Refresh open data
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fetch_open_gene_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-manifest
          path: data/raw/manifest.json
          retention-days: 30
