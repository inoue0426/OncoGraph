name: Refresh open data
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fetch_open_gene_sources.py
      - name: Retain source manifest
        uses: actions/upload-artifact@v4
        with:
          name: source-manifest
          path: data/raw/manifest.json
          if-no-files-found: error
          retention-days: 30
