<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OncoGraph</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>OncoGraph</h1>
      <p>Evidence-first oncology knowledge graph.</p>
      <input id="search" type="search" placeholder="Search genes, drugs, or diseases" />
      <p id="status">Loading…</p>
      <section id="results"></section>
      <footer>
        Research use only. Verify source evidence before drawing conclusions.
        <p>
          Includes approved-drug/target data from the
          <a href="https://www.guidetopharmacology.org/">IUPHAR/BPS Guide to PHARMACOLOGY (GtoPdb)</a>,
          database licensed under ODbL, content licensed under CC BY-SA 4.0.
        </p>
      </footer>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
