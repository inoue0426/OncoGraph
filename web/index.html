<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OncoGraph</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="evidence-trails.css" />
    <link rel="stylesheet" href="guide.css" />
  </head>
  <body>
    <main>
      <h1>OncoGraph</h1>
      <p>Evidence-first oncology knowledge graph.</p>
      <input
        id="search"
        type="search"
        placeholder="e.g. gefitinib, EGFR, ovarian cancer drugs, osimertinib trials"
      />
      <section id="stats" class="stats" aria-label="Knowledge graph coverage" hidden></section>
      <p class="examples-label">Try:</p>
      <div id="examples"></div>
      <section id="trail-highlights" class="trail-highlights" aria-label="Guided evidence trails" hidden></section>
      <section id="disease-guide" class="disease-guide" aria-label="Browse cancer disease names" hidden></section>
      <p id="status">Loading…</p>
      <section id="results"></section>
      <section id="detail" hidden></section>
      <section id="evidence-panel" class="evidence-panel" hidden></section>
      <footer>
        <p>Research use only. Verify source evidence before drawing conclusions.</p>
        <p id="attribution"></p>
      </footer>
    </main>
    <script src="evidence-trails.js" defer></script>
    <script src="disease-guide.js" defer></script>
    <script src="civic-evidence.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
